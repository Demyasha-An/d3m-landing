<!DOCTYPE html>
<html lang="ru" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0710" />
    <title>Документы — d3mvpn</title>
    <meta name="description" content="Документы сервиса d3mvpn: оферта, политика конфиденциальности, правила, согласие на обработку данных." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="/" aria-label="d3mvpn — на главную">
          <img class="brand__logo" src="/logo.svg" alt="" width="26" height="26" />
          <span class="brand__name">d3mvpn</span>
        </a>
        <a class="legal__back" href="/">← На главную</a>
      </header>
      <main class="legal docs">
        <aside class="docs__side">
          <details class="docs__drop">
            <summary class="docs__drop-btn">
              <span data-drop-label>Документы</span>
              <svg class="docs__drop-caret" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </summary>
            <nav class="docs__drop-list" aria-label="Документы">
<!--NAV_DROP-->
            </nav>
          </details>
          <nav class="docs__nav" aria-label="Документы">
            <p class="docs__nav-title">Документы</p>
<!--NAV_SIDE-->
          </nav>
        </aside>
        <div class="docs__content">
<!--SECTIONS-->
        </div>
      </main>
      <footer class="site-footer">
        <p class="site-footer__copy">© <span id="yr"></span> d3mvpn. Все права защищены.</p>
      </footer>
    </div>
    <script>
      document.getElementById("yr").textContent = new Date().getFullYear();
      (function () {
        var links = Array.prototype.slice.call(document.querySelectorAll("[data-doc-link]"));
        var sections = Array.prototype.slice.call(document.querySelectorAll("[data-doc]"));
        var ids = links.map(function (a) { return a.getAttribute("data-doc-link"); });
        function closeDrop(drop) {
          if (!drop || !drop.hasAttribute("open")) return;
          var list = drop.querySelector(".docs__drop-list");
          if (!list) {
            drop.removeAttribute("open");
            return;
          }
          list.classList.add("is-closing");
          setTimeout(function () {
            drop.removeAttribute("open");
            list.classList.remove("is-closing");
          }, 180);
        }
        function activate(id, push) {
          if (ids.indexOf(id) === -1) return;
          links.forEach(function (a) {
            var on = a.getAttribute("data-doc-link") === id;
            a.classList.toggle("is-active", on);
            if (on) {
              var label = document.querySelector("[data-drop-label]");
              if (label) label.textContent = a.textContent;
              closeDrop(a.closest("details"));
            }
          });
          if (push !== false) {
            try { history.replaceState(null, "", "#doc-" + id); } catch (e) {}
          }
        }
        // Animated close when tapping the summary while open.
        document.querySelectorAll(".docs__drop").forEach(function (d) {
          var summary = d.querySelector("summary");
          if (!summary) return;
          summary.addEventListener("click", function (e) {
            if (d.hasAttribute("open")) {
              e.preventDefault();
              closeDrop(d);
            }
          });
        });
        // Scrollspy: highlight the section currently in view.
        if ("IntersectionObserver" in window) {
          var spy = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) activate(entry.target.getAttribute("data-doc"), true);
              });
            },
            { rootMargin: "-30% 0px -55% 0px" }
          );
          sections.forEach(function (s) { spy.observe(s); });
        }
        // Deep link: /docs#doc-rules scrolls to the section on load.
        var initial = (location.hash || "").replace(/^#doc-/, "").replace(/^#/, "");
        var target = document.getElementById("doc-" + initial) || document.getElementById("doc-" + ids[0]);
        if (target) {
          activate(initial);
          setTimeout(function () { target.scrollIntoView(); }, 60);
        }
      })();
    </script>
  </body>
</html>
