services:
  d3mvpn:
    build: .
    image: ghcr.io/demyasha-an/d3m-landing:latest
    container_name: d3mvpn-landing
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Legal texts (personal data!) live ONLY here, never in git.
      - ./legal:/app/legal:ro
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - remnawave-network

# Shared with the reverse proxy (rezeis-nginx) — must exist:
# docker network create remnawave-network
networks:
  remnawave-network:
    external: true
