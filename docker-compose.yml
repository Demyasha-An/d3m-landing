services:
  d3mvpn:
    build: .
    image: ${IMAGE:-ghcr.io/demyasha-an/d3m-landing:latest}
    container_name: d3mvpn-landing
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
